<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 高専祭HP掲載用の合同バナー（左：SNCT SHOOTER／右：高専ダッシュ！）。render.sh で PNG に書き出す -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+1p:wght@800;900&family=Orbitron:wght@900&family=Bebas+Neue&family=Noto+Sans+JP:wght@900&family=Courier+Prime:wght@700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; overflow: hidden; }
  #frame { position: relative; overflow: hidden; background: #07041a; }
  .half { position: absolute; inset: 0; }
  .half canvas.bg { position: absolute; inset: 0; }
  #seam { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  #border { position: absolute; inset: 0; z-index: 6; border: var(--border) solid #FFD21F; pointer-events: none; }

  .copy { position: absolute; z-index: 3; color: #fff; }
  .badge {
    display: inline-block;
    font-family: 'M PLUS 1p', sans-serif; font-weight: 900;
    letter-spacing: 0.06em; white-space: nowrap;
    border: var(--line) solid #000;
    box-shadow: var(--shadow) var(--shadow) 0 #000;
  }

  /* ---- SHOOTER ---- */
  .shooter .badge { background: #FF2266; color: #fff; transform: rotate(-3deg); }
  .shooter .title {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    line-height: 0.95; letter-spacing: 0.02em; white-space: nowrap;
    color: #FFE600;
    -webkit-text-stroke: var(--stroke) #000;
    paint-order: stroke fill;
    text-shadow: var(--tshadow) var(--tshadow) 0 #FF2266, calc(var(--tshadow) * 1.9) calc(var(--tshadow) * 1.9) 0 #00E5FF;
  }
  .shooter .catch {
    font-family: 'M PLUS 1p', sans-serif; font-weight: 900;
    color: #fff; letter-spacing: 0.06em; white-space: nowrap;
    text-shadow: calc(var(--u) * 0.5) calc(var(--u) * 0.5) 0 #000;
  }
  .shooter .catch em { font-style: normal; color: #FFE600; font-size: 1.3em; }
  .phone {
    position: absolute; z-index: 2;
    background: #111; border-radius: calc(var(--pw) * 0.13);
    padding: calc(var(--pw) * 0.035);
    border: calc(var(--pw) * 0.012) solid #3a3a48;
    box-shadow: calc(var(--pw) * 0.05) calc(var(--pw) * 0.05) 0 #000, 0 0 calc(var(--pw) * 0.3) rgba(170, 0, 255, 0.5);
  }
  .phone canvas { display: block; border-radius: calc(var(--pw) * 0.09); }

  /* ---- DASH ---- */
  .dash .badge { background: #111; color: #fff; border-color: #fff; border-radius: 999px; box-shadow: var(--shadow) var(--shadow) 0 #FF3D8B; transform: rotate(-2deg); }
  .dash .badge em { font-style: normal; color: #FFD21F; }
  .dash .title {
    font-family: 'Dela Gothic One', sans-serif;
    line-height: 1.05; white-space: nowrap;
    color: #FFD21F;
    -webkit-text-stroke: var(--stroke) #111;
    paint-order: stroke fill;
    text-shadow: var(--tshadow) var(--tshadow) 0 #FF3D8B, calc(var(--tshadow) * 1.8) calc(var(--tshadow) * 1.8) 0 #111;
    transform: skewX(-8deg); transform-origin: left bottom;
  }
  .dash .title .bang { color: #fff; margin-left: -0.2em; }
  .shot {
    position: absolute; z-index: 2; overflow: hidden;
    border: calc(var(--line) * 1.2) solid #fff; border-radius: calc(var(--u) * 1.2);
    box-shadow: var(--shadow) var(--shadow) 0 #111, 0 0 calc(var(--u) * 4) rgba(0, 0, 0, 0.45);
    background: #000;
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* 印刷用（layout=print）だけ表示する QR パネル */
  #qr { position: absolute; z-index: 5; display: none; flex-direction: column; align-items: center; }
  #qr .qr-label {
    font-family: 'M PLUS 1p', sans-serif; font-weight: 900; color: #fff; white-space: nowrap;
    letter-spacing: 0.06em; text-shadow: calc(var(--u) * 0.35) calc(var(--u) * 0.35) 0 #000;
  }
  #qr .qr-card {
    background: #fff; border: calc(var(--line) * 1.3) solid #111; border-radius: calc(var(--u) * 2);
    box-shadow: var(--shadow) var(--shadow) 0 #FF3D8B;
  }
  #qr .qr-card img { display: block; width: 100%; height: 100%; }
  #qr .qr-url {
    font-family: 'Orbitron', sans-serif; font-weight: 900; color: #FFD21F; white-space: nowrap;
    letter-spacing: 0.02em; text-shadow: calc(var(--u) * 0.35) calc(var(--u) * 0.35) 0 #000;
  }
  .stamp {
    position: absolute; z-index: 5;
    border-radius: 50%;
    background: #FF3D8B; color: #fff;
    border: var(--line) solid #000;
    box-shadow: var(--shadow) var(--shadow) 0 #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Dela Gothic One', sans-serif; line-height: 1.15; text-align: center;
    transform: rotate(-10deg);
    outline: calc(var(--line) * 0.8) solid #fff; outline-offset: calc(var(--line) * -2.6);
  }

  /* ===== ポータル（第61回鈴鹿高専祭「collage」デザインシステム）風テーマ：layout=print で使用 ===== */
  #frame.portal { --blue: #1a33d6; --red: #e31b23; --yellow: #f4d21f; --ink: #111111; --paper: #f8f8f8; background: var(--paper); }
  .portal #border { border-color: var(--ink); border-width: calc(var(--u) * 0.9); }
  .portal #seam { filter: url(#brush-edge); }
  .portal .badge {
    background: transparent; border: 0; box-shadow: none; border-radius: 0;
    position: relative; z-index: 0;
    font-family: 'Noto Sans JP', sans-serif; font-weight: 900;
  }
  .portal .badge::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--tape-bg); filter: url(#tape-edge-l);
  }
  .portal .shooter .badge { --tape-bg: var(--red); color: #fff; }
  .portal .dash .badge { --tape-bg: var(--yellow); color: var(--ink); }
  .portal .dash .badge em { color: var(--red); }
  .portal .shooter .title {
    font-family: 'Bebas Neue', sans-serif; font-weight: 400;
    color: var(--ink); -webkit-text-stroke: 0; letter-spacing: 0.03em; line-height: 0.86;
    text-shadow: var(--tshadow) var(--tshadow) 0 var(--yellow);
  }
  .portal .dash .title {
    font-family: 'Noto Sans JP', sans-serif; font-weight: 900; letter-spacing: 0.02em; line-height: 1.12;
    color: var(--ink); -webkit-text-stroke: 0; transform: none;
    text-shadow: var(--tshadow) var(--tshadow) 0 var(--yellow);
  }
  .portal .dash .title .bang { color: var(--red); }
  .portal .shooter .catch {
    font-family: 'Noto Sans JP', sans-serif; color: var(--ink); text-shadow: none; line-height: 1.3;
  }
  .portal .shooter .catch em { color: var(--red); }
  .portal .phone {
    border-color: var(--ink);
    box-shadow: calc(var(--pw) * 0.05) calc(var(--pw) * 0.05) 0 var(--ink);
  }
  .portal .shot {
    border: calc(var(--line) * 1.1) solid var(--ink); border-radius: 0;
    box-shadow: var(--shadow) var(--shadow) 0 var(--ink);
  }
  .portal #qr .qr-label {
    position: relative; z-index: 0; color: #fff; text-shadow: none;
    font-family: 'Noto Sans JP', sans-serif; padding: calc(var(--u) * 0.8) calc(var(--u) * 3);
    transform: rotate(-2deg);
  }
  .portal #qr .qr-label::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: var(--ink); filter: url(#tape-edge-l);
  }
  .portal #qr .qr-card {
    border: calc(var(--line) * 1.1) solid var(--ink); border-radius: 0;
    box-shadow: var(--shadow) var(--shadow) 0 var(--ink);
  }
  .portal #qr .qr-url {
    font-family: 'Courier Prime', monospace; font-weight: 700; color: var(--ink); text-shadow: none; letter-spacing: 0;
  }
  .portal .stamp {
    background: var(--red); border-color: var(--ink);
    box-shadow: var(--shadow) var(--shadow) 0 var(--ink);
  }
  .portal .stamp #stamp2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.3em; letter-spacing: 0.06em; }
  .portal .deco { position: absolute; z-index: 1; pointer-events: none; }
  .portal .deco-star { position: absolute; z-index: 3; line-height: 1; font-family: 'Noto Sans JP', sans-serif; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- ポータルの tape-edge / torn-edge を、バナーの解像度に合わせて強めたもの -->
    <filter id="tape-edge-l" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.2" numOctaves="3" seed="7" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" />
    </filter>
    <filter id="brush-edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.01" numOctaves="3" seed="4" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" />
    </filter>
    <filter id="torn-edge-l" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="4" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" />
    </filter>
    <pattern id="dots-blue" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#f8f8f8" />
      <circle cx="11" cy="11" r="5.5" fill="#1A33D6" />
    </pattern>
    <pattern id="stripe-red" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#f8f8f8" />
      <rect width="18" height="8" fill="#E31B23" />
    </pattern>
  </defs>
</svg>
<div id="frame">
  <div class="half shooter" id="shooter">
    <canvas class="bg" id="bgShooter"></canvas>
    <div class="phone" id="phone"><canvas id="screen"></canvas></div>
    <div class="copy" id="copyS">
      <div class="badge" id="badgeS">懐かしのスペースシューティング！</div>
      <div class="title" id="titleS">SNCT<br>SHOOTER</div>
      <div class="catch" id="catchS">ランキング<em>1位</em>を目指せ！！</div>
    </div>
  </div>
  <div class="half dash" id="dash">
    <canvas class="bg" id="bgDash"></canvas>
    <div class="shot" id="shot1"><img src="shots/dash-denki.png" alt=""></div>
    <div class="shot" id="shot2"><img src="shots/dash-joho.png" alt=""></div>
    <div class="shot" id="shot3"><img src="shots/dash-zairyo.png" alt=""></div>
    <div class="copy" id="copyD">
      <div class="badge" id="badgeD">鈴鹿高専の<em>5学科</em>を走り抜けろ！</div>
      <div class="title" id="titleD">高専<br>ダッシュ<span class="bang">！</span></div>
    </div>
  </div>
  <canvas id="seam"></canvas>
  <div id="qr">
    <div class="qr-label" id="qrLabel">＼ 今すぐプレイ！ ／</div>
    <div class="qr-card" id="qrCard"><img src="../qr/snct-games-qr.svg" alt=""></div>
    <div class="qr-url" id="qrUrl">snct-games.vercel.app</div>
  </div>
  <div class="stamp" id="stamp"><span id="stamp1">高専祭</span><span id="stamp2">GAME</span></div>
  <div id="border"></div>
</div>
<script>
const params = new URLSearchParams(location.search)
const W = Number(params.get('w') || 2400)
const H = Number(params.get('h') || 600)
const layout = params.get('layout') || 'wide'

// 寸法はすべて u（= 高さの1%）基準。斜めの境界線は上端 seamTop・下端 seamBot を結ぶ
const LAYOUTS = {
  wide: {
    seamTop: 0.535, seamBot: 0.465,
    phoneH: 0.9, phoneX: 0.035, phoneY: 0.06, phoneRot: -7,
    copySX: 0.19, titleS: 19, badgeS: 4.6, catchS: 6.4,
    copyDX: 0.535, titleD: 18, badgeD: 4.6,
    shotsX: 0.762, shotW: 0.82, shotsTop: 0.08, shotsBottom: 0.9,
    stamp: 0.29, stampY: 0.82,
  },
  tall: {
    seamTop: 0.54, seamBot: 0.46,
    phoneH: 0.9, phoneX: 0.03, phoneY: 0.055, phoneRot: -7,
    copySX: 0.2, titleS: 17, badgeS: 4.2, catchS: 5.8,
    copyDX: 0.54, titleD: 15.5, badgeD: 3.9,
    shotsX: 0.75, shotW: 0.9, shotsTop: 0.05, shotsBottom: 0.95,
    stamp: 0.24, stampY: 0.83,
  },
  // パンフレット等の印刷物向け（2:1）。右端にポータルのQRコードを大きく置き、各ゲームは縦積みにする
  print: {
    seamTop: 0.356, seamBot: 0.316,
    phoneH: 0.56, phoneX: 0.182, phoneY: 0.5, phoneRot: 6,
    theme: 'portal', noBadge: true,
    copySX: 0.027, copySY: 0.035, copySRight: 0.333, titleS: 18.5, catchS: 5.8, catchBreak: true,
    copyDX: 0.378, copyDY: 0.03, titleD: 12,
    shotsX: 0.36, shotsRight: 0.662, shotW: 0.86, shotsTop: 0.3, shotsBottom: 0.95,
    qrX: 0.678, qrSize: 0.5, qrLabelS: 4.8, qrUrlS: 3.6,
    stamp: 0.15, stampX: 0.945, stampY: 0.12,
    // [種類, x, y, 幅, 高さ, 回転] 位置と大きさは W・H に対する割合
    deco: [
      ['dots', 0.025, 0.71, 0.085, 0.2, -6],
      ['stripe', 0.64, 0.85, 0.042, 0.1, 10],
      ['star', 0.186, 0.06, 0.032, 0, 15, 'red'],
      ['star', 0.1, 0.66, 0.03, 0, -18, 'blue'],
      ['star', 0.648, 0.17, 0.03, 0, -12, 'blue'],
    ],
  },
  // 高専祭HPの企画ページ（/entry/）のトップ画像向け（16:9）。印刷用からQRを外し、2作品を左右に並べる
  entry: {
    seamTop: 0.515, seamBot: 0.455,
    phoneH: 0.5, phoneX: 0.3, phoneY: 0.5, phoneRot: 6,
    theme: 'portal', noBadge: true,
    copySX: 0.035, copySY: 0.05, copySRight: 0.45, titleS: 19, catchS: 5.8, catchBreak: true,
    copyDX: 0.54, copyDY: 0.05, titleD: 12,
    shotsX: 0.5, shotsRight: 0.97, shotW: 0.62, shotsTop: 0.4, shotsBottom: 0.95,
    stamp: 0.2, stampX: 0.915, stampY: 0.15,
    deco: [
      ['dots', 0.03, 0.68, 0.09, 0.22, -6],
      ['stripe', 0.42, 0.06, 0.045, 0.1, 10],
      ['star', 0.2, 0.08, 0.035, 0, 15, 'red'],
      ['star', 0.12, 0.62, 0.032, 0, -18, 'blue'],
      ['star', 0.94, 0.36, 0.032, 0, -12, 'blue'],
    ],
  },
}
const L = LAYOUTS[layout]
const portal = L.theme === 'portal'
if (portal) document.getElementById('frame').classList.add('portal')
const u = H / 100
const sTop = W * L.seamTop
const sBot = W * L.seamBot
const seamXAt = (y) => sTop + (sBot - sTop) * (y / H)

const frame = document.getElementById('frame')
frame.style.width = W + 'px'
frame.style.height = H + 'px'
frame.style.setProperty('--u', u + 'px')
frame.style.setProperty('--line', Math.max(3, u * 0.55) + 'px')
frame.style.setProperty('--shadow', u * 0.9 + 'px')
frame.style.setProperty('--stroke', u * 1.1 + 'px')
frame.style.setProperty('--tshadow', u * 0.9 + 'px')
frame.style.setProperty('--border', u * 1.6 + 'px')

document.getElementById('shooter').style.clipPath = `polygon(0 0, ${sTop}px 0, ${sBot}px ${H}px, 0 ${H}px)`
document.getElementById('dash').style.clipPath = `polygon(${sTop}px 0, ${W}px 0, ${W}px ${H}px, ${sBot}px ${H}px)`

function styleCopy(prefix, x, titleSize, badgeSize, catchSize, maxRight) {
  const copy = document.getElementById('copy' + prefix)
  copy.style.left = x + 'px'
  copy.style.maxWidth = maxRight - x + 'px'
  const badge = document.getElementById('badge' + prefix)
  if (L.noBadge) badge.style.display = 'none'
  badge.style.fontSize = badgeSize * u + 'px'
  badge.style.padding = `${u * 0.9}px ${u * 2.4}px`
  badge.style.marginBottom = u * 3.4 + 'px'
  const title = document.getElementById('title' + prefix)
  if (prefix === 'S' && L.titleSOneLine) title.innerHTML = 'SNCT SHOOTER'
  if (prefix === 'D' && L.titleDOneLine) title.innerHTML = '高専ダッシュ<span class="bang">！</span>'
  let size = titleSize * u
  title.style.fontSize = size + 'px'
  // 境界線にかからない幅まで縮める
  const room = maxRight - x
  const w = title.scrollWidth + u * 3
  if (w > room) title.style.fontSize = (size * room) / w + 'px'
  const catchEl = document.getElementById('catch' + prefix)
  if (catchEl) {
    if (L.catchBreak) catchEl.innerHTML = 'ランキング<em>1位</em>を<br>目指せ！！'
    if (L.catchHtml) catchEl.innerHTML = L.catchHtml
    catchEl.style.fontSize = catchSize * u + 'px'
    catchEl.style.marginTop = u * (L.noBadge ? 2.5 : 4) + 'px'
  }
  const fixedY = L['copy' + prefix + 'Y']
  copy.style.top = (fixedY !== undefined ? H * fixedY : (H - copy.offsetHeight) / 2 - u * 2) + 'px'
  return copy
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

function sizedCanvas(canvas, w, h) {
  canvas.width = w
  canvas.height = h
  canvas.style.width = w + 'px'
  canvas.style.height = h + 'px'
  return canvas.getContext('2d')
}

function triangleDown(ctx, x, y, s, color) {
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.moveTo(x, y + s); ctx.lineTo(x - s, y - s); ctx.lineTo(x + s, y - s)
  ctx.closePath(); ctx.fill()
}

function triangleUp(ctx, x, y, w, h, color) {
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.moveTo(x, y - h / 2); ctx.lineTo(x - w / 2, y + h / 2); ctx.lineTo(x + w / 2, y + h / 2)
  ctx.closePath(); ctx.fill()
}

function dot(ctx, x, y, r, color) {
  ctx.fillStyle = color
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill()
}

function healEnemy(ctx, x, y, r) {
  dot(ctx, x, y, r, '#00CC88')
  ctx.fillStyle = '#FFFFFF'
  ctx.fillRect(x - r * 0.43, y - r * 0.14, r * 0.86, r * 0.28)
  ctx.fillRect(x - r * 0.14, y - r * 0.43, r * 0.28, r * 0.86)
}

function hexBoss(ctx, x, y, r, color) {
  ctx.fillStyle = color
  ctx.beginPath()
  for (let i = 0; i < 6; i++) {
    const a = (i * Math.PI) / 3 - Math.PI / 6
    const px = x + Math.cos(a) * r * 1.4
    const py = y + Math.sin(a) * r * 0.8
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)
  }
  ctx.closePath(); ctx.fill()
}

function burst(ctx, rand, x, y, spread, n, colors) {
  for (let i = 0; i < n; i++) {
    const a = rand() * Math.PI * 2
    const d = rand() * spread
    ctx.globalAlpha = 0.4 + rand() * 0.6
    const s = 1.5 + rand() * spread * 0.09
    ctx.fillStyle = colors[i % colors.length]
    ctx.fillRect(x + Math.cos(a) * d - s / 2, y + Math.sin(a) * d - s / 2, s, s)
  }
  ctx.globalAlpha = 1
}

// ===== 左半分：SNCT SHOOTER =====
function drawPaper(id) {
  const ctx = sizedCanvas(document.getElementById(id), W, H)
  ctx.fillStyle = '#f8f8f8'
  ctx.fillRect(0, 0, W, H)
}

function drawShooterBg(copyRect) {
  if (portal) return drawPaper('bgShooter')
  const ctx = sizedCanvas(document.getElementById('bgShooter'), W, H)
  const rand = mulberry32(7)
  const g = ctx.createLinearGradient(0, 0, sTop, H)
  g.addColorStop(0, '#05030f')
  g.addColorStop(1, '#140838')
  ctx.fillStyle = g
  ctx.fillRect(0, 0, W, H)
  const nebulae = [
    [W * 0.09, H * 0.5, H * 0.85, 'rgba(170, 0, 255, 0.32)'],
    [W * 0.35, H * 1.05, H * 0.8, 'rgba(255, 34, 102, 0.18)'],
    [W * 0.4, H * -0.1, H * 0.7, 'rgba(0, 229, 255, 0.12)'],
  ]
  for (const [x, y, r, c] of nebulae) {
    const ng = ctx.createRadialGradient(x, y, 0, x, y, r)
    ng.addColorStop(0, c)
    ng.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.fillStyle = ng
    ctx.fillRect(0, 0, W, H)
  }
  const starCount = Math.round((sTop * H) / 2000)
  for (let i = 0; i < starCount; i++) {
    ctx.globalAlpha = 0.25 + rand() * 0.75
    const s = (0.6 + rand() * 1.6) * (u / 6)
    ctx.fillStyle = '#FFFFFF'
    ctx.fillRect(rand() * sTop, rand() * H, s, s)
  }
  ctx.globalAlpha = 1

  // 敵弾・敵機の飾り（文字と境界線の近くには置かない）
  const deco = [
    ['tri', 0.42, 0.13, 3.0, '#FF4444'],
    ['tri', 0.025, 0.12, 2.4, '#FF8800'],
    ['tri', 0.395, 0.9, 2.6, '#FFAA00'],
    ['heal', 0.43, 0.48, 2.0],
    ['dot', 0.172, 0.82, 0.9, '#FF0000'],
    ['dot', 0.18, 0.86, 0.9, '#FF0000'],
    ['dot', 0.188, 0.9, 0.9, '#FF0000'],
  ]
  for (const d of deco) {
    const x = W * d[1]
    const y = H * d[2]
    const s = d[3] * u
    if (x + s > seamXAt(y) - u * 4) continue
    if (x + s > copyRect.left && x - s < copyRect.right && y + s > copyRect.top && y - s < copyRect.bottom) continue
    ctx.globalAlpha = 0.85
    if (d[0] === 'tri') triangleDown(ctx, x, y, s, d[4])
    if (d[0] === 'heal') healEnemy(ctx, x, y, s)
    if (d[0] === 'dot') dot(ctx, x, y, s, d[4])
  }
  ctx.globalAlpha = 1
}

function drawScreen(screenW, screenH) {
  const canvas = document.getElementById('screen')
  const ctx = sizedCanvas(canvas, screenW, screenH)
  ctx.scale(screenW / 390, screenH / 844)
  const rand = mulberry32(42)

  ctx.fillStyle = '#000000'
  ctx.fillRect(0, 0, 390, 844)
  for (let i = 0; i < 80; i++) {
    ctx.globalAlpha = 0.3 + rand() * 0.7
    const s = 1 + rand() * 2
    ctx.fillStyle = '#FFFFFF'
    ctx.fillRect(rand() * 390, rand() * 844, s, s)
  }
  ctx.globalAlpha = 1

  const bossX = 195
  const bossY = 210
  for (let ring = 0; ring < 3; ring++) {
    const n = 14
    const dist = 80 + ring * 70
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + ring * 0.22
      const x = bossX + Math.cos(a) * dist
      const y = bossY + Math.sin(a) * dist * 1.05
      if (y < 110 || x < 6 || x > 384) continue
      dot(ctx, x, y, 6, '#FF0000')
    }
  }
  hexBoss(ctx, bossX, bossY, 40, '#AA00FF')
  ctx.fillStyle = '#333'
  ctx.fillRect(bossX - 50, bossY - 60, 100, 8)
  ctx.fillStyle = '#AA00FF'
  ctx.fillRect(bossX - 50, bossY - 60, 58, 8)
  ctx.strokeStyle = '#FFFFFF'
  ctx.lineWidth = 1
  ctx.strokeRect(bossX - 50, bossY - 60, 100, 8)

  triangleDown(ctx, 70, 470, 15, '#FF4444')
  triangleDown(ctx, 320, 430, 15, '#FF4444')
  triangleDown(ctx, 300, 560, 20, '#FF8800')
  dot(ctx, 285, 600, 5, '#FF4444')
  dot(ctx, 272, 632, 5, '#FF4444')
  healEnemy(ctx, 90, 590, 14)
  burst(ctx, rand, 150, 400, 26, 22, ['#FF4444', '#FFE600', '#FFFFFF'])

  const px = 190
  const py = 740
  for (let k = 0; k < 7; k++) {
    const y = py - 40 - k * 58
    dot(ctx, px, y, 4, '#FFFF00')
    dot(ctx, px - Math.tan(Math.PI / 12) * (py - 40 - y) - 10, y + 6, 4, '#FFFF00')
    dot(ctx, px + Math.tan(Math.PI / 12) * (py - 40 - y) + 10, y + 6, 4, '#FFFF00')
  }
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.85)'
  ctx.lineWidth = 2
  ctx.beginPath(); ctx.arc(px, py, 30, 0, Math.PI * 2); ctx.stroke()
  triangleUp(ctx, px, py, 30, 36, '#FFFFFF')

  ctx.fillStyle = '#FFFFFF'
  ctx.font = '16px monospace'
  ctx.textBaseline = 'top'
  ctx.fillText('SCORE', 16, 14)
  ctx.fillText('STAGE', 172, 14)
  ctx.textAlign = 'right'
  ctx.fillText('LIVES', 374, 14)
  ctx.font = 'bold 20px monospace'
  ctx.fillText('♥♥♥', 374, 34)
  ctx.textAlign = 'center'
  ctx.fillText('4', 195, 34)
  ctx.textAlign = 'left'
  ctx.fillText('12,480', 16, 34)
  ctx.font = '11px monospace'
  ctx.fillStyle = '#00E5FF'
  ctx.textAlign = 'right'
  ctx.fillText('GUARD READY', 374, 62)
  ctx.fillRect(310, 78, 64, 6)
}

function placePhone() {
  const phone = document.getElementById('phone')
  const edge = 0.035 + 0.012
  const phoneH = H * L.phoneH
  const screenH = phoneH * 0.92
  const screenW = (screenH * 390) / 844
  const pw = screenW / (1 - 2 * edge)
  phone.style.setProperty('--pw', pw + 'px')
  phone.style.left = W * L.phoneX + 'px'
  phone.style.top = H * L.phoneY + 'px'
  phone.style.transform = `rotate(${L.phoneRot}deg)`
  drawScreen(Math.round(screenW), Math.round(screenH))
}

// ===== 右半分：高専ダッシュ！ =====
function drawDashBg(copyRect) {
  if (portal) return drawPaper('bgDash')
  const ctx = sizedCanvas(document.getElementById('bgDash'), W, H)
  const g = ctx.createLinearGradient(sBot, 0, W, H)
  g.addColorStop(0, '#141a3a')
  g.addColorStop(1, '#2a1150')
  ctx.fillStyle = g
  ctx.fillRect(0, 0, W, H)
  const glow = ctx.createRadialGradient(W * 0.86, H * 0.55, 0, W * 0.86, H * 0.55, H * 0.9)
  glow.addColorStop(0, 'rgba(255, 61, 139, 0.28)')
  glow.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = glow
  ctx.fillRect(0, 0, W, H)

  // 方眼
  ctx.strokeStyle = 'rgba(120, 140, 255, 0.13)'
  ctx.lineWidth = Math.max(1, u * 0.15)
  const step = u * 6
  for (let x = sBot - step * 4; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke()
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke()
  }

  // 走りの流線
  const rand = mulberry32(11)
  for (let i = 0; i < 14; i++) {
    const y = H * (0.06 + rand() * 0.88)
    const x0 = seamXAt(y) + u * 4 + rand() * W * 0.1
    const len = u * (10 + rand() * 30)
    if (y > copyRect.top - u * 2 && y < copyRect.bottom + u * 2 && x0 < copyRect.right) continue
    ctx.strokeStyle = i % 3 === 0 ? 'rgba(255, 210, 31, 0.35)' : 'rgba(255, 255, 255, 0.12)'
    ctx.lineWidth = Math.max(2, u * (0.4 + rand() * 0.8))
    ctx.lineCap = 'round'
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + len, y); ctx.stroke()
  }
}

// ゲーム画面（snct-dash を自動プレイして撮影したもの）を互い違いに並べる
function placeShots() {
  const left = W * L.shotsX
  const region = (L.shotsRight ? W * L.shotsRight : W - u * 5) - left
  const w = region * L.shotW
  const h = (w * 280) / 800
  const top = H * L.shotsTop
  const step = (H * L.shotsBottom - top - h) / 2
  const tilts = [-4, 3, -3]
  ;['shot1', 'shot2', 'shot3'].forEach((id, i) => {
    const el = document.getElementById(id)
    el.style.width = w + 'px'
    el.style.height = h + 'px'
    el.style.left = left + (i % 2 === 1 ? region - w : 0) + 'px'
    el.style.top = top + step * i + 'px'
    el.style.transform = `rotate(${tilts[i]}deg)`
  })
}

// ===== 境界線 =====
function drawSeam() {
  const ctx = sizedCanvas(document.getElementById('seam'), W, H)
  const line = (w, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = w
    ctx.beginPath(); ctx.moveTo(sTop, -u * 5); ctx.lineTo(sBot, H + u * 5); ctx.stroke()
  }
  if (portal) {
    // ポータルの区切り線と同じ、ちぎれた赤い帯
    line(u * 2.6, '#e31b23')
    return
  }
  line(u * 3.6, '#111')
  line(u * 2, '#FFD21F')
  ctx.save()
  ctx.translate(u * 1.4, u * 1.2)
  ctx.globalCompositeOperation = 'destination-over'
  line(u * 3.6, 'rgba(0,0,0,0.6)')
  ctx.restore()
}

function placeDeco() {
  const frame = document.getElementById('frame')
  const NS = 'http://www.w3.org/2000/svg'
  for (const [kind, x, y, w, h, rot, color] of L.deco || []) {
    if (kind === 'star') {
      const el = document.createElement('span')
      el.className = 'deco-star'
      el.textContent = '★'
      el.style.color = color === 'red' ? '#e31b23' : '#1a33d6'
      el.style.fontSize = W * w + 'px'
      el.style.left = W * x + 'px'
      el.style.top = H * y + 'px'
      el.style.transform = `rotate(${rot}deg)`
      frame.appendChild(el)
      continue
    }
    const svg = document.createElementNS(NS, 'svg')
    svg.classList.add('deco')
    svg.setAttribute('width', W * w)
    svg.setAttribute('height', H * h)
    svg.style.left = W * x + 'px'
    svg.style.top = H * y + 'px'
    svg.style.transform = `rotate(${rot}deg)`
    const rect = document.createElementNS(NS, 'rect')
    rect.setAttribute('width', '100%')
    rect.setAttribute('height', '100%')
    rect.setAttribute('fill', kind === 'dots' ? 'url(#dots-blue)' : 'url(#stripe-red)')
    rect.setAttribute('filter', 'url(#torn-edge-l)')
    svg.appendChild(rect)
    frame.appendChild(svg)
  }
}

function placeQr() {
  const qr = document.getElementById('qr')
  const size = H * L.qrSize
  qr.style.display = 'flex'
  qr.style.left = W * L.qrX + 'px'
  qr.style.width = W - u * 5 - W * L.qrX + 'px'
  const card = document.getElementById('qrCard')
  card.style.width = card.style.height = size + 'px'
  card.style.margin = `${u * 2.5}px 0 ${u * 2.5}px`
  document.getElementById('qrLabel').style.fontSize = u * L.qrLabelS + 'px'
  document.getElementById('qrUrl').style.fontSize = u * L.qrUrlS + 'px'
  qr.style.top = (H - qr.offsetHeight) / 2 + u * 3 + 'px'
}

function placeStamp() {
  const stamp = document.getElementById('stamp')
  const size = H * L.stamp
  const cy = H * L.stampY
  stamp.style.width = stamp.style.height = size + 'px'
  stamp.style.left = (L.stampX ? W * L.stampX : seamXAt(cy)) - size / 2 + 'px'
  stamp.style.top = cy - size / 2 + 'px'
  const s1 = document.getElementById('stamp1')
  s1.style.fontSize = size * 0.24 + 'px'
  s1.style.fontFamily = "'M PLUS 1p', sans-serif"
  s1.style.fontWeight = '900'
  s1.style.letterSpacing = '0.04em'
  document.getElementById('stamp2').style.fontSize = size * 0.18 + 'px'
}

// 後から差し込む文字（スタンプ・星）のフォントも先に読み込む。待たないと書き出し時に抜けることがある
Promise.all([
  document.fonts.load("900 10px 'M PLUS 1p'", '高専祭'),
  document.fonts.load("900 10px 'Noto Sans JP'", '★'),
]).then(() => document.fonts.ready).then(() => {
  placePhone()
  const phoneRight = document.getElementById('phone').getBoundingClientRect().right
  const copySX = L.copySY !== undefined ? W * L.copySX : Math.max(W * L.copySX, phoneRight + u * 5)
  const copyS = styleCopy('S', copySX, L.titleS, L.badgeS, L.catchS, L.copySRight ? W * L.copySRight : seamXAt(H * 0.6) - u * 6)
  const copyD = styleCopy('D', W * L.copyDX, L.titleD, L.badgeD, 0, L.shotsRight ? W * L.shotsRight : W * L.shotsX - u * 3)
  drawShooterBg(copyS.getBoundingClientRect())
  drawDashBg(copyD.getBoundingClientRect())
  placeShots()
  drawSeam()
  placeStamp()
  if (L.qrX) placeQr()
  if (portal) placeDeco()
  document.body.dataset.ready = '1'
})
</script>
